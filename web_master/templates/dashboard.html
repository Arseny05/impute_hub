<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Imputation Hub | Concierge</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .service-card { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .service-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .service-link { text-decoration: none; color: inherit; }
    </style>
</head>
<body class="bg-light">
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-5">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="#">
                <img src="{{ url_for('static', filename='logo.png') }}" width="40" height="40" class="me-2" alt="Logo">
                MicroService Pipeline
            </a>
            <div class="d-flex">
                <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Sign Out</a>
            </div>
        </div>
    </nav>

    <!-- Workspace Cards -->
    <div class="container">
        <h2 class="mb-4">Select Workspace</h2>
        <div class="row g-4">
            
            <div class="col-md-4">
                <a href="{{ services.collector }}" target="_blank" class="service-link">
                    <div class="card h-100 p-3 service-card border-0 shadow-sm">
                        <div class="card-body text-center">
                            <h1 class="display-4 mb-3">📥</h1>
                            <h5 class="card-title">Collector Service</h5>
                            <p class="card-text text-muted">Upload and collect raw dataset batches for processing.</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="{{ services.impute }}" target="_blank" class="service-link">
                    <div class="card h-100 p-3 service-card border-0 shadow-sm">
                        <div class="card-body text-center">
                            <h1 class="display-4 mb-3">🧠</h1>
                            <h5 class="card-title">ML / Impute Service</h5>
                            <p class="card-text text-muted">Run missing data algorithms (MissForest, Mode, Arim).</p>
                        </div>
                    </div>
                </a>
            </div>

            <div class="col-md-4">
                <a href="{{ services.visualization }}" target="_blank" class="service-link">
                    <div class="card h-100 p-3 service-card border-0 shadow-sm">
                        <div class="card-body text-center">
                            <h1 class="display-4 mb-3">📊</h1>
                            <h5 class="card-title">Visualization Service</h5>
                            <p class="card-text text-muted">Interactive Plotly dashboards, KDE analysis and reports.</p>
                        </div>
                    </div>
                </a>
            </div>

        </div>
    </div>
</body>
</html>
